<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title4">
  <title id="title4">Raketten – steg 4</title>
  <defs>
    <radialGradient id="body4" cx="0.35" cy="0.25" r="0.95">
      <stop offset="0%" stop-color="#AEEAF2"/>
      <stop offset="50%" stop-color="#3FB2C6"/>
      <stop offset="100%" stop-color="#006A7D"/>
    </radialGradient>
    <radialGradient id="rim4" cx="0.5" cy="0.4" r="0.62">
      <stop offset="72%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00404B" stop-opacity="0.32"/>
    </radialGradient>
    <linearGradient id="visor4" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#14333D"/>
      <stop offset="55%" stop-color="#2E7A8E"/>
      <stop offset="100%" stop-color="#62C9D9"/>
    </linearGradient>
  </defs>

  <!-- bakkeskygge -->
  <ellipse cx="210" cy="362" rx="94" ry="14" fill="#0A3A42" opacity="0.14"/>

  <!-- vindlinjer -->
  <g stroke="#62C9D9" stroke-linecap="round" fill="none">
    <path d="M34 140 H 110" stroke-width="8" opacity="0.85"/>
    <path d="M20 184 H 96" stroke-width="8" opacity="0.6"/>
    <path d="M42 228 H 104" stroke-width="8" opacity="0.4"/>
    <path d="M56 300 H 108" stroke-width="6" opacity="0.3"/>
  </g>

  <!-- hele figuren lener seg framover -->
  <g transform="rotate(8 200 220)">
    <!-- bakre arm, strømlinjet bakover -->
    <path d="M270 200 Q 302 212 314 240" stroke="#0F8CA0" stroke-width="22" fill="none" stroke-linecap="round"/>

    <!-- bakre bein i steg -->
    <path d="M170 280 Q 148 304 124 310" stroke="#00687A" stroke-width="25" fill="none" stroke-linecap="round"/>
    <g transform="rotate(-30 108 318)">
      <rect x="74" y="306" width="58" height="21" rx="10.5" fill="#FFF6E8"/>
      <rect x="74" y="321" width="58" height="8" rx="4" fill="#E2BE8C"/>
      <path d="M86 315 Q 98 322 110 318" stroke="#FF9F68" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- fremre bein langt fram -->
    <path d="M226 278 Q 246 300 268 308" stroke="#00687A" stroke-width="25" fill="none" stroke-linecap="round"/>
    <g transform="rotate(14 286 320)">
      <rect x="254" y="308" width="60" height="21" rx="10.5" fill="#FFF6E8"/>
      <rect x="254" y="323" width="60" height="8" rx="4" fill="#E2BE8C"/>
      <path d="M266 317 Q 278 324 292 320" stroke="#FF9F68" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- slank, dråpeformet kropp -->
    <path d="M206 54 C 262 58 292 122 288 198 C 285 260 252 296 200 296 C 148 296 114 260 112 200 C 110 128 138 50 206 54 Z" fill="url(#body4)"/>
    <path d="M206 54 C 262 58 292 122 288 198 C 285 260 252 296 200 296 C 148 296 114 260 112 200 C 110 128 138 50 206 54 Z" fill="url(#rim4)"/>

    <!-- fremre arm, sveipt bakover -->
    <path d="M128 214 Q 108 234 108 258" stroke="#1E9DB2" stroke-width="22" fill="none" stroke-linecap="round"/>

    <!-- kult visir -->
    <rect x="128" y="146" width="158" height="52" rx="26" fill="url(#visor4)"/>
    <rect x="128" y="146" width="158" height="52" rx="26" fill="none" stroke="#0E2830" stroke-width="3" opacity="0.5"/>
    <path d="M148 162 H 192" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
    <path d="M150 178 H 172" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
    <!-- stropp bak visiret -->
    <path d="M284 160 Q 296 168 292 182" stroke="#0E2830" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- høylys på kroppen -->
    <ellipse cx="164" cy="92" rx="26" ry="14" fill="#FFFFFF" opacity="0.55" transform="rotate(-14 164 92)"/>
    <circle cx="134" cy="220" r="7" fill="#FFFFFF" opacity="0.3"/>

    <!-- kinn og kult lite smil -->
    <ellipse cx="146" cy="222" rx="11" ry="7" fill="#FF9F68" opacity="0.35"/>
    <ellipse cx="258" cy="222" rx="11" ry="7" fill="#FF9F68" opacity="0.35"/>
    <path d="M186 232 Q 204 244 222 230" stroke="#173037" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
